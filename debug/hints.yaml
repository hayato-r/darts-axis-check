# 改善ヒント文言テンプレ
# 指標 × プレイヤータイプ (A1/A2/B1/B2/default) の組み合わせ — 9 × 5 = 45件
# 作成: 2026-06-09

takeback_position:
  A1: "テイクバック位置が毎回変わっています。A1は顔の横に浅めに引くテイクバックが自然です。「顔の横・毎回同じ高さ」を目印にして、鏡の前で位置を固定する素振りをしてください。"
  A2: "テイクバック位置が毎回変わっています。A2は深めに顔に引くテイクバックが安定の鍵です。「薬指の第一関節が耳の横」を毎回の目印にして、位置を揃える素振りが効果的です。"
  B1: "テイクバック位置が毎回変わっています。B1は深めに肩へ近づけるテイクバックが特徴です。「肩の直前で止める」位置を録画で確認しながら固定してください。"
  B2: "テイクバック位置が毎回変わっています。B2は浅めに肩へ近づけるテイクバックが自然です。「肩より少し手前で止める」位置を素振りで体に覚えさせてください。"
  default: "テイクバック位置が毎回変わっています。「毎回同じ位置に引く」ことを意識し、録画で自分のフォームを確認して目印となる位置を決めてください。"

release_position:
  A1: "リリース位置が毎回ズレています。A1は前腕主導のスイングなので、手首より肘の角度を一定に保つ意識を持つと改善します。"
  A2: "リリース位置が毎回ズレています。A2はスイング動作が特徴なので、振りの終点(リリース)を時計の同じ位置で離す素振り練習が効きます。"
  B1: "リリース位置が毎回ズレています。B1はプッシュ動作が特徴なので、肘から先を「真っ直ぐ前に押し出す」感覚を意識すると安定しやすいです。"
  B2: "リリース位置が毎回ズレています。B2は真下からの押し上げが特徴です。肘の高さを固定すると、リリース位置が揃いやすいです。"
  default: "リリース位置が毎回ズレています。リリースの瞬間を録画で見比べて、共通点を探してみてください。"

trajectory_length:
  A1: "軌跡の長さが毎回バラバラです。A1はしなやかなスイングが特徴ですが、スイング幅が安定しないと軌跡長がブレます。「引いた分だけ振り切る」意識で、テイクバックとフォロースルーの幅を揃える素振りが効果的です。"
  A2: "軌跡の長さが毎回バラバラです。A2はコンパクトな1軸スイングが理想です。「腕の動く範囲を一定にする」意識を持ち、フォロースルーが毎回同じ高さで止まるよう鏡で確認してください。"
  B1: "軌跡の長さが毎回バラバラです。B1はプッシュ型で押し出しの距離が軌跡長に直結します。「肩から指先まで一定の押し出し距離」を体に叩き込む素振りで安定させてください。"
  B2: "軌跡の長さが毎回バラバラです。B2は体重移動が大きいため、重心移動のタイミングが軌跡長に影響します。体重移動のリズムを一定にすることが軌跡安定の近道です。"
  default: "軌跡の長さが毎回バラバラです。テイクバックの深さとフォロースルーの長さを毎回揃えることを意識し、録画で確認してください。"

arc_wh_ratio:
  A1: "スイング軌道の形がブレています。A1はスイング型で弧を描く投げ方が自然ですが、横ブレが混ざっています。「肘を体の正面で動かす」意識で、縦方向の弧を意識した素振りが効果的です。"
  A2: "スイング軌道の形がブレています。A2は1軸の縦ラインが理想のため、横ブレはスコアへの影響が大きいです。鏡で正面から自分のフォームを見て、腕が左右に流れていないか確認してください。"
  B1: "スイング軌道の形がブレています。B1は本来「縦長プッシュ」が理想ですが、横方向の動きが混ざっている可能性があります。鏡の前で素振りして、軌道を視覚で固定する練習が有効です。"
  B2: "スイング軌道の形がブレています。B2は体重移動が大きいため、移動方向が左右にブレると軌道形状が変わります。体重移動を「前後だけ」に絞る意識で投げてみてください。"
  default: "スイング軌道の形がブレています。プッシュ↔スイングが混ざっている可能性があります。鏡の前で素振りして、毎回同じ形の軌道になっているか確認してください。"

release_angle:
  A1: "リリース角度が毎回ズレています。A1はフォロースルー時に手の甲が天井を向くのが理想です。フォロースルーの手の甲の向きを毎回確認し、角度を揃える素振りをしてください。"
  A2: "リリース角度が毎回ズレています。A2は手の甲が右斜め天井を向くフォロースルーが理想です。フォロースルーの終点を毎回同じ角度で止める練習をしてください。"
  B1: "リリース角度が毎回ズレています。B1は手の甲が左斜め天井を向くフォロースルーが理想です。「押し出す方向の延長上にダーツが飛ぶ」意識で、リリースの瞬間に肘の高さを固定してください。"
  B2: "リリース角度が毎回ズレています。B2は手の甲が天井と垂直を向くフォロースルーが理想です。「空手チョップのように縦に押し出す」フィニッシュを録画で確認してください。"
  default: "リリース角度が毎回ズレています。フォロースルー時の手の甲の向きを毎回同じにすることを意識し、録画で確認してください。"

throw_interval:
  A1: "投擲間隔のバラツキが大きいです。A1はリズム感が大切なタイプです。「テイクバック→リリース」の一連の動作をメトロノームのように一定のリズムで行う練習が効果的です。"
  A2: "投擲間隔のバラツキが大きいです。A2はコンパクトで速い動作が得意なタイプです。毎回同じ「間合い」を作ってから投げる習慣を身につけると、リズムが安定します。"
  B1: "投擲間隔のバラツキが大きいです。B1は後ろ重心に乗ってから一気に押し出すタイプです。「後ろ足に乗る→前足に移す→押し出す」3ステップのテンポを一定にすることがポイントです。"
  B2: "投擲間隔のバラツキが大きいです。B2は体重移動が大きいため、準備時間にバラツキが出やすいです。「後ろ足に乗る→前足に移す」体重移動のリズムを一定にすることが安定への近道です。"
  default: "投擲間隔のバラツキが大きいです。毎回同じテンポで「構え→テイクバック→リリース」の流れを作る意識を持ち、慌てず一定のリズムで投げてください。"

trunk_drift:
  A1: "投擲中に胴体が動いています。A1はクロスタイプで体重移動がありますが、胴体の過度な揺れはリリース位置のブレにつながります。「みぞおちを固定点として腕だけを動かす」意識で、上半身の無駄な動きを抑えてください。"
  A2: "投擲中に胴体が動いています。A2は1軸スイングが基本で、胴体は動かさないのが理想です。足幅を狭めにして「地面に根を張る」姿勢を作り、スイング中に背骨の軸がブレないよう意識してください。"
  B1: "投擲中に胴体が動いています。B1は肩・腰・膝をスクエアに保つことが重要です。鏡の前で「胴体を固定したまま腕だけ動かす」素振りをして、上半身の前後揺れを抑えてください。"
  B2: "投擲中に胴体が動いています。B2は体重移動が大きいタイプですが、上半身の縦揺れは不要な動きです。「前後への体重移動」と「上下の胴体ブレ」を切り離す意識で投げてみてください。"
  default: "投擲中に胴体が動いています。胴体を安定させることがリリースの一貫性につながります。鏡の前で「胴体を固定したまま腕だけ動かす」素振りで安定させてください。"

head_drift:
  A1: "頭が動いています。A1はしなやかな動きの中で視線が流れやすいです。「ターゲットの一点を凝視したまま投げる」意識で、頭を動かさない素振りをしてください。"
  A2: "頭が動いています。A2は1軸スイングで軸が安定するほど頭も安定するはずです。足幅と背骨の軸を確認し、「軸を固定→頭を動かさない」順に改善すると効果的です。"
  B1: "頭が動いています。B1は直線的な押し出しが特徴で、視線もターゲットへの直線上に固定するのが理想です。「ダーツの飛ぶ方向を目で追わない」意識で、頭を固定したまま投げてください。"
  B2: "頭が動いています。B2は体重移動が大きいため、体の動きにつられて頭も動きやすいです。体重移動は「下半身だけ」という意識を持ち、頭と上半身を安定させてください。"
  default: "頭が動いています。狙う点をターゲットの一点に固定して、頭を動かさない素振りで安定しやすいです。"

back_foot_drift:
  A1: "軸足がブレています。A1は対角方向への体重移動があるため、軸足の安定が土台となります。「後ろ足の内側に重心を感じながら構える」意識を持ち、投擲中に後ろ足が浮かないよう意識してください。"
  A2: "軸足がブレています。A2は狭めスタンスで1軸を保つことが重要です。後ろ足を「錨」として地面に固定する意識で、スイング中に足の位置が動かないよう確認してください。"
  B1: "軸足がブレています。B1は後ろ足に重心を載せてから前足に移動する動作が特徴です。「後ろ足の踏ん張りが押し出しのエネルギー源」と意識し、軸足の安定を強化してください。"
  B2: "軸足がブレています。B2は広めスタンスで大きな体重移動をするため、軸足の安定が特に重要です。「両足でしっかり地面を踏む」広めスタンスを確認し、後ろ足が流れないよう踏ん張る練習をしてください。"
  default: "軸足がブレています。投擲中に軸足が動くとリリース位置が毎回変わります。「投げ終わっても足が動いていないか」録画で確認し、足の位置を固定することを意識してください。"
